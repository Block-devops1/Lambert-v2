<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in — Lambert</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/logo-mark.svg" type="image/svg+xml" />
    <link
      rel="icon"
      href="/icons/favicon-32.png"
      sizes="32x32"
      type="image/png"
    />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#070b16" />
    <link rel="stylesheet" href="/motion.css" />
    <!-- Link preview (Open Graph). The image URL must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lambert" />
    <meta property="og:title" content="Log in — Lambert" />
    <meta property="og:description" content="Log in to see today’s numbers." />
    <meta
      property="og:url"
      content="https://v2-lambert.vercel.app/login.html"
    />
    <meta
      property="og:image"
      content="https://v2-lambert.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Lambert, a habit tracker with an AI coach, showing 169 of 180 minutes built today."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      :root {
        --bg: #070b16;
        --card: #0f1729;
        --line: #1b2640;
        --text: #e8edf7;
        --muted: #8693ad;
        --amber: #f59e0b;
        --green: #10b981;
        --red: #ef4444;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", system-ui, sans-serif;
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .box {
        width: 100%;
        max-width: 400px;
      }
      .logo {
        font-weight: 800;
        letter-spacing: 3px;
        font-size: 0.85rem;
        text-align: center;
        margin-bottom: 26px;
        display: block;
        color: var(--text);
        text-decoration: none;
      }
      .logo span {
        color: var(--amber);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 26px;
      }
      h1 {
        font-size: 1.4rem;
        font-weight: 800;
        margin-bottom: 6px;
      }
      .sub {
        color: var(--muted);
        font-size: 0.88rem;
        margin-bottom: 20px;
      }
      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        background: #0a1122;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 4px;
        margin-bottom: 20px;
      }
      .tabs button {
        transition:
          background 0.15s,
          color 0.15s;
        border: 0;
        background: none;
        color: var(--muted);
        font:
          600 0.85rem Inter,
          sans-serif;
        padding: 10px;
        border-radius: 9px;
        cursor: pointer;
      }
      .tabs button.on {
        background: var(--card);
        color: var(--text);
        box-shadow: 0 0 0 1px var(--line);
      }
      label {
        display: block;
        font-size: 0.72rem;
        letter-spacing: 1px;
        color: var(--muted);
        text-transform: uppercase;
        margin: 14px 0 6px;
      }
      input {
        width: 100%;
        padding: 13px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: #0a1122;
        color: var(--text);
        font:
          500 0.95rem Inter,
          sans-serif;
      }
      input:focus {
        outline: 2px solid rgba(245, 158, 11, 0.5);
        outline-offset: 0;
      }
      .go {
        position: relative;
        width: 100%;
        margin-top: 20px;
        padding: 14px;
        border: 0;
        border-radius: 11px;
        background: var(--amber);
        color: #1a1000;
        font:
          700 0.95rem Inter,
          sans-serif;
        cursor: pointer;
      }
      .go:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      /* Loading: the label gives way to a small spinner. */
      .go.busy {
        color: transparent;
      }
      .go.busy::after {
        content: "";
        position: absolute;
        inset: 0;
        margin: auto;
        width: 18px;
        height: 18px;
        border: 2px solid rgba(26, 16, 0, 0.25);
        border-top-color: #1a1000;
        border-radius: 50%;
        animation: m-spin 0.7s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .go.busy {
          color: #1a1000;
        }
        .go.busy::after {
          display: none;
        }
      }
      .msg {
        margin-top: 14px;
        font-size: 0.84rem;
        padding: 11px 13px;
        border-radius: 10px;
        display: none;
      }
      .msg.err,
      .msg.ok {
        animation: m-rise 0.25s ease-out;
      }
      .msg.err {
        display: block;
        background: rgba(239, 68, 68, 0.12);
        color: #fca5a5;
        border: 1px solid rgba(239, 68, 68, 0.3);
      }
      .msg.ok {
        display: block;
        background: rgba(16, 185, 129, 0.12);
        color: #6ee7b7;
        border: 1px solid rgba(16, 185, 129, 0.3);
      }
      .back {
        display: block;
        text-align: center;
        margin-top: 18px;
        font-size: 0.8rem;
        color: var(--muted);
        text-decoration: none;
      }
      /* The confirm-password field slides open for Sign up. */
      .collapse {
        display: grid;
        grid-template-rows: 0fr;
        opacity: 0;
        visibility: hidden;
        transition:
          grid-template-rows 0.25s ease,
          opacity 0.2s ease,
          visibility 0s 0.25s;
      }
      .collapse.open {
        grid-template-rows: 1fr;
        opacity: 1;
        visibility: visible;
        transition-delay: 0s;
      }
      .collapse-in {
        overflow: hidden;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div class="box enter">
      <a class="logo" href="/">LAMBERT<span>.</span></a>
      <div class="card">
        <h1 id="title" class="m-swap">Welcome back</h1>
        <p class="sub m-swap" id="sub">Log in to see today’s numbers.</p>
        <div class="tabs">
          <button type="button" id="t-in" class="on">Log in</button>
          <button type="button" id="t-up">Sign up</button>
        </div>
        <form id="f" novalidate>
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
          />
          <label for="pw">Password</label>
          <input
            id="pw"
            type="password"
            autocomplete="current-password"
            placeholder="At least 8 characters"
          />
          <div id="pw2-wrap" class="collapse">
            <div class="collapse-in">
              <label for="pw2">Confirm password</label>
              <input
                id="pw2"
                type="password"
                autocomplete="new-password"
                placeholder="Repeat your password"
              />
            </div>
          </div>
          <button class="go" id="go" type="submit">Log in</button>
          <div class="msg" id="msg" role="alert"></div>
        </form>
      </div>
      <a class="back" href="/">Back to the welcome page</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="/api/config"></script>
    <script src="/motion.js"></script>
    <script>
      // Motion is cosmetic. If motion.js is missing, everything still works.
      window.Motion = window.Motion || {};
      Motion.swap =
        Motion.swap ||
        function (el, t) {
          el.textContent = t;
        };
      Motion.leave =
        Motion.leave ||
        function (u) {
          location.href = u;
        };
    </script>
    <script>
      var C = window.LAMBERT || {},
        sb = null,
        mode = "in";
      var $ = function (id) {
        return document.getElementById(id);
      };

      function say(text, kind) {
        var m = $("msg");
        m.textContent = text || "";
        m.className = "msg";
        void m.offsetWidth; // restart the fade even if the same message repeats
        m.className = "msg" + (text ? " " + kind : "");
      }

      function setMode(m) {
        mode = m;
        var up = m === "up";
        $("t-in").className = up ? "" : "on";
        $("t-up").className = up ? "on" : "";
        Motion.swap($("title"), up ? "Create your account" : "Welcome back");
        Motion.swap(
          $("sub"),
          up
            ? "New accounts wait for approval before they can log in to the dashboard."
            : "Log in to see today’s numbers.",
        );
        $("go").textContent = up ? "Sign up" : "Log in";
        $("pw2-wrap").classList.toggle("open", up);
        $("pw").autocomplete = up ? "new-password" : "current-password";
        say("");
      }
      $("t-in").onclick = function () {
        setMode("in");
      };
      $("t-up").onclick = function () {
        setMode("up");
      };
      if (location.hash === "#signup") setMode("up");

      if (!C.SUPABASE_URL || !C.SUPABASE_ANON_KEY) {
        say(
          "This site isn’t connected to its database yet. SUPABASE_URL and SUPABASE_ANON_KEY must be set in Vercel.",
          "err",
        );
        $("go").disabled = true;
      } else {
        sb = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
        sb.auth.getSession().then(function (r) {
          if (r.data && r.data.session) location.replace("/app.html");
        });
      }

      $("f").onsubmit = async function (e) {
        e.preventDefault();
        if (!sb) return;
        var email = $("email").value.trim(),
          pw = $("pw").value;
        if (!/^\S+@\S+\.\S+$/.test(email))
          return say("Enter a valid email address.", "err");
        if (pw.length < 8)
          return say("Password must be at least 8 characters.", "err");
        if (mode === "up" && pw !== $("pw2").value)
          return say("The two passwords don’t match.", "err");

        var leaving = false;
        $("go").disabled = true;
        $("go").classList.add("busy");
        say("");
        try {
          if (mode === "in") {
            var r = await sb.auth.signInWithPassword({
              email: email,
              password: pw,
            });
            if (r.error) return say(r.error.message, "err");
            leaving = true;
            Motion.leave("/app.html");
          } else {
            var s = await sb.auth.signUp({ email: email, password: pw });
            if (s.error) return say(s.error.message, "err");
            if (
              s.data.user &&
              s.data.user.identities &&
              s.data.user.identities.length === 0
            ) {
              return say(
                "That email already has an account. Log in instead.",
                "err",
              );
            }
            if (s.data.session) {
              leaving = true;
              Motion.leave("/app.html");
            } else
              say(
                "Account created. Check your email to confirm it, then log in.",
                "ok",
              );
          }
        } catch (err) {
          say(
            "Something went wrong. Check your connection and try again.",
            "err",
          );
        } finally {
          if (!leaving) {
            $("go").disabled = false;
            $("go").classList.remove("busy");
          }
        }
      };
    </script>
  </body>
</html>
