<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in — Lambert</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/logo-mark.svg" type="image/svg+xml" />
    <link
      rel="icon"
      href="/icons/favicon-32.png"
      sizes="32x32"
      type="image/png"
    />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#070b16" />
    <style>
      :root {
        --bg: #070b16;
        --card: #0f1729;
        --line: #1b2640;
        --text: #e8edf7;
        --muted: #8693ad;
        --amber: #f59e0b;
        --green: #10b981;
        --red: #ef4444;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", system-ui, sans-serif;
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .box {
        width: 100%;
        max-width: 400px;
      }
      .logo {
        font-weight: 800;
        letter-spacing: 3px;
        font-size: 0.85rem;
        text-align: center;
        margin-bottom: 26px;
        display: block;
        color: var(--text);
        text-decoration: none;
      }
      .logo span {
        color: var(--amber);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 26px;
      }
      h1 {
        font-size: 1.4rem;
        font-weight: 800;
        margin-bottom: 6px;
      }
      .sub {
        color: var(--muted);
        font-size: 0.88rem;
        margin-bottom: 20px;
      }
      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        background: #0a1122;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 4px;
        margin-bottom: 20px;
      }
      .tabs button {
        border: 0;
        background: none;
        color: var(--muted);
        font:
          600 0.85rem Inter,
          sans-serif;
        padding: 10px;
        border-radius: 9px;
        cursor: pointer;
      }
      .tabs button.on {
        background: var(--card);
        color: var(--text);
        box-shadow: 0 0 0 1px var(--line);
      }
      label {
        display: block;
        font-size: 0.72rem;
        letter-spacing: 1px;
        color: var(--muted);
        text-transform: uppercase;
        margin: 14px 0 6px;
      }
      input {
        width: 100%;
        padding: 13px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: #0a1122;
        color: var(--text);
        font:
          500 0.95rem Inter,
          sans-serif;
      }
      input:focus {
        outline: 2px solid rgba(245, 158, 11, 0.5);
        outline-offset: 0;
      }
      .go {
        width: 100%;
        margin-top: 20px;
        padding: 14px;
        border: 0;
        border-radius: 11px;
        background: var(--amber);
        color: #1a1000;
        font:
          700 0.95rem Inter,
          sans-serif;
        cursor: pointer;
      }
      .go:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .msg {
        margin-top: 14px;
        font-size: 0.84rem;
        padding: 11px 13px;
        border-radius: 10px;
        display: none;
      }
      .msg.err {
        display: block;
        background: rgba(239, 68, 68, 0.12);
        color: #fca5a5;
        border: 1px solid rgba(239, 68, 68, 0.3);
      }
      .msg.ok {
        display: block;
        background: rgba(16, 185, 129, 0.12);
        color: #6ee7b7;
        border: 1px solid rgba(16, 185, 129, 0.3);
      }
      .back {
        display: block;
        text-align: center;
        margin-top: 18px;
        font-size: 0.8rem;
        color: var(--muted);
        text-decoration: none;
      }
      .hide {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <a class="logo" href="/">LAMBERT<span>.</span></a>
      <div class="card">
        <h1 id="title">Welcome back</h1>
        <p class="sub" id="sub">Log in to see today’s numbers.</p>
        <div class="tabs">
          <button type="button" id="t-in" class="on">Log in</button>
          <button type="button" id="t-up">Sign up</button>
        </div>
        <form id="f" novalidate>
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
          />
          <label for="pw">Password</label>
          <input
            id="pw"
            type="password"
            autocomplete="current-password"
            placeholder="At least 8 characters"
          />
          <div id="pw2-wrap" class="hide">
            <label for="pw2">Confirm password</label>
            <input
              id="pw2"
              type="password"
              autocomplete="new-password"
              placeholder="Repeat your password"
            />
          </div>
          <button class="go" id="go" type="submit">Log in</button>
          <div class="msg" id="msg" role="alert"></div>
        </form>
      </div>
      <a class="back" href="/">← Back to the welcome page</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="/api/config"></script>
    <script>
      var C = window.LAMBERT || {},
        sb = null,
        mode = "in";
      var $ = function (id) {
        return document.getElementById(id);
      };

      function say(text, kind) {
        var m = $("msg");
        m.textContent = text || "";
        m.className = "msg" + (text ? " " + kind : "");
      }

      function setMode(m) {
        mode = m;
        var up = m === "up";
        $("t-in").className = up ? "" : "on";
        $("t-up").className = up ? "on" : "";
        $("title").textContent = up ? "Create your account" : "Welcome back";
        $("sub").textContent = up
          ? "New accounts wait for approval before they can log in to the dashboard."
          : "Log in to see today’s numbers.";
        $("go").textContent = up ? "Sign up" : "Log in";
        $("pw2-wrap").className = up ? "" : "hide";
        $("pw").autocomplete = up ? "new-password" : "current-password";
        say("");
      }
      $("t-in").onclick = function () {
        setMode("in");
      };
      $("t-up").onclick = function () {
        setMode("up");
      };
      if (location.hash === "#signup") setMode("up");

      if (!C.SUPABASE_URL || !C.SUPABASE_ANON_KEY) {
        say(
          "This site isn’t connected to its database yet. SUPABASE_URL and SUPABASE_ANON_KEY must be set in Vercel.",
          "err",
        );
        $("go").disabled = true;
      } else {
        sb = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
        sb.auth.getSession().then(function (r) {
          if (r.data && r.data.session) location.replace("/app.html");
        });
      }

      $("f").onsubmit = async function (e) {
        e.preventDefault();
        if (!sb) return;
        var email = $("email").value.trim(),
          pw = $("pw").value;
        if (!/^\S+@\S+\.\S+$/.test(email))
          return say("Enter a valid email address.", "err");
        if (pw.length < 8)
          return say("Password must be at least 8 characters.", "err");
        if (mode === "up" && pw !== $("pw2").value)
          return say("The two passwords don’t match.", "err");

        $("go").disabled = true;
        say("");
        try {
          if (mode === "in") {
            var r = await sb.auth.signInWithPassword({
              email: email,
              password: pw,
            });
            if (r.error) return say(r.error.message, "err");
            location.href = "/app.html";
          } else {
            var s = await sb.auth.signUp({ email: email, password: pw });
            if (s.error) return say(s.error.message, "err");
            if (
              s.data.user &&
              s.data.user.identities &&
              s.data.user.identities.length === 0
            ) {
              return say(
                "That email already has an account. Log in instead.",
                "err",
              );
            }
            if (s.data.session) location.href = "/app.html";
            else
              say(
                "Account created. Check your email to confirm it, then log in.",
                "ok",
              );
          }
        } catch (err) {
          say(
            "Something went wrong. Check your connection and try again.",
            "err",
          );
        } finally {
          $("go").disabled = false;
        }
      };
    </script>
  </body>
</html>
